<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spec Board</title>
    <!-- Sets the theme before first paint, so a dark OS never sees a light flash. Mirrors lib/theme.ts
         (THEME_KEY, savedThemeChoice, resolveTheme), which stays in charge once the app runs. -->
    <script>
      (function () {
        var c = 'system';
        try {
          var s = localStorage.getItem('specboard.theme');
          if (s === 'light' || s === 'dark' || s === 'system') c = s;
        } catch (e) {}
        if (c === 'system') {
          try {
            c = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } catch (e) {
            c = 'light';
          }
        }
        document.documentElement.setAttribute('data-theme', c);
      })();
    </script>
