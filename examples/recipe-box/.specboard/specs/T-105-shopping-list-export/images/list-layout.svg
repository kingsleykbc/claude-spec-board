<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" role="img" aria-label="Shopping list sketch">
  <rect width="320" height="180" rx="10" fill="#f6f1e7" stroke="#d9cfb8"/>
  <text x="20" y="34" font-family="sans-serif" font-size="15" font-weight="700" fill="#3b3326">Shopping list</text>
  <text x="20" y="62" font-family="sans-serif" font-size="11" font-weight="700" fill="#8a7d5f">PRODUCE</text>
  <text x="20" y="80" font-family="sans-serif" font-size="13" fill="#3b3326">[ ] 3 tomatoes</text>
  <text x="20" y="104" font-family="sans-serif" font-size="11" font-weight="700" fill="#8a7d5f">PANTRY</text>
  <text x="20" y="122" font-family="sans-serif" font-size="13" fill="#3b3326">[ ] 400 g flour</text>
  <text x="20" y="140" font-family="sans-serif" font-size="13" fill="#3b3326">[ ] 1 tsp salt</text>
</svg>
